name: Full Tests

on:
  push:
    branches: [main, master]
    # Governance/doc-only changes do not affect the plugin build -> no CI proof
    # required (rule "Local = Build, Tests = CI": an unchanged code commit's green
    # run stands). Ignore pure-doc paths.
    paths-ignore:
      - '**/*.adoc'
      - '**/*.md'
      - '.agents/**'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - 'slides/**'
      - 'readme_images/**'
  # Manual trigger — also lets a workflow-only change be validated without a code push.
  workflow_dispatch:

# Cancel superseded runs on the same ref — saves runner-minutes on rapid pushes.
concurrency:
  group: full-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── unit tests ──────────────────────────────────────────────────────────────────
  # The plugin's JUnit suite (`test`), excluding the shard runners and the
  # environment-gated Playwright visual tests (which self-skip without the root
  # consumer fixtures + Chromium).
  unit:
    name: "Unit tests"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew test
        working-directory: slider-plugin
        env:
          CI: "true"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-unit
          path: slider-plugin/build/reports/

  # ── BDD shards (parallel machines) ────────────────────────────────────────────
  # The monolithic `cucumberTest` aggregate is split into EXHAUSTIVE, DISJOINT
  # feature shards, each on its own runner, in a single JVM (keeps the aggregate's
  # efficiency). Guarded by slider.ci.SliderCucumberShardCoverageTest.
  #
  # Every slider feature is pure-domain (no ffmpeg, no Chromium) — unlike capsule —
  # so no `binaries` install step is needed here.
  bdd-shard:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The `core` shard runs `proposeDeckContext` (RAG-assisted), which starts a
          # pgvector container via docker-java. The image must be pre-pulled: the
          # plugin's own `pullImageCmd` is unreliable on CI (anonymous Docker Hub pull).
          - name: "BDD · core"
            task: cucumberTestShardCore
            pgvector: true
          - name: "BDD · i18n"
            task: cucumberTestShardI18n
            pgvector: false
          - name: "BDD · translation"
            task: cucumberTestShardTranslation
            pgvector: false
          - name: "BDD · repository"
            task: cucumberTestShardRepository
            pgvector: false
          - name: "BDD · decomposition"
            task: cucumberTestShardDecomposition
            pgvector: false
          - name: "BDD · content"
            task: cucumberTestShardContent
            pgvector: false
          - name: "BDD · pipeline"
            task: cucumberTestShardPipeline
            pgvector: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Pre-pull pgvector image
        if: ${{ matrix.pgvector }}
        run: docker pull pgvector/pgvector:pg17

      - name: Run BDD shard
        run: ./gradlew ${{ matrix.task }}
        working-directory: slider-plugin
        env:
          CI: "true"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.task }}
          path: slider-plugin/build/reports/

  # ── functionalTest shards (TestKit) ────────────────────────────────────────────
  # `functionalTest` split into 3 EXHAUSTIVE, DISJOINT class shards via `--tests`.
  # Guarded by slider.ci.SliderCucumberShardCoverageTest (3rd assertion).
  functional-shard:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Functional · core"
            tests: "--tests slider.AsciidoctorJPinFunctionalTest --tests slider.RevealUiMessagesFunctionalTest --tests slider.SlideDeploymentFunctionalTest"
          - name: "Functional · wiring+i18n"
            tests: "--tests slider.GradleWiringFunctionalTest --tests slider.i18n.TaskDescriptionsI18nFunctionalTest --tests slider.i18n.AssistantManagerI18nFunctionalTest"
          - name: "Functional · translate+pipeline"
            tests: "--tests slider.TranslateDeckFunctionalTest --tests slider.TranslatorFunctionalTest --tests slider.GenerateDeckPipelineFunctionalTest"
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run functional shard
        run: ./gradlew functionalTest ${{ matrix.tests }}
        working-directory: slider-plugin
        env:
          CI: "true"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-functionalshard-${{ strategy.job-index }}
          path: slider-plugin/build/reports/
