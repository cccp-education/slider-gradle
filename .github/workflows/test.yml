name: Test

on:
  pull_request:
    branches: [main, master]
    # Governance/doc-only changes do not affect the plugin build (rule
    # "Local = Build, Tests = CI"): skip CI on pure-doc paths.
    paths-ignore:
      - '**/*.adoc'
      - '**/*.md'
      - '.agents/**'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - 'slides/**'
      - 'readme_images/**'

jobs:
  test:
    name: Fast Tests (PR Gate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: cccpeducation/cccp-ci-base@sha256:4722c1bcc71c0343c05257842b774715fc2574ff79182599a29fe8c1361cbeb3

    steps:
      - uses: actions/checkout@v4
      - name: Verify Gradle wrapper version
        uses: cccp-education/conventions-gradle/.github/actions/verify-gradle-wrapper@main

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # GBL-013 US-5 — the runtime image provides JDK 25; `ci/run.sh fast`
      # runs the unit tests (Playwright visual tests self-skip without fixtures).
      - name: Run fast tests (unit)
        run: ci/run.sh fast
        env:
          CI: "true"
