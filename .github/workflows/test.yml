name: Test

on:
  pull_request:
    branches: [main, master]
    # Governance/doc-only changes do not affect the plugin build (rule
    # "Local = Build, Tests = CI"): skip CI on pure-doc paths.
    paths-ignore:
      - '**/*.adoc'
      - '**/*.md'
      - '.agents/**'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - 'slides/**'
      - 'readme_images/**'

jobs:
  test:
    name: Fast Tests (PR Gate)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Fast PR gate: unit tests only. functionalTest + cucumberTest run in the
      # `Full Tests` matrix workflow on push to main.
      - name: Run fast tests (unit)
        run: ./gradlew test
        working-directory: slider-plugin
        env:
          CI: "true"
